services:
  db:
    image: postgres:15-alpine
    container_name: ree_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ree-network

networks:
  ree-network:
    driver: bridge

volumes:
  postgres_data: